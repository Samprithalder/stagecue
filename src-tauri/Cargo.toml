[package]
name = "stagecue"
version = "0.1.0"
description = "Cue-based theatre playback and backdrop control"
authors = ["StageCue contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "stagecue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-single-instance = "2"
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
rodio = { version = "0.23", default-features = true, features = ["playback"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
