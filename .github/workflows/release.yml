# StageCue release automation.
#
# Tag a build (git tag v0.1.0 && git push --tags) and GitHub Actions builds
# installers for Linux, Windows and macOS, then attaches them to a Release
# draft carrying the same tag. workflow_dispatch lets you trigger from
# github.com without tags.
#
# Artifacts are unsigned: installers warn "unknown publisher" (Windows
# SmartScreen) / require right-click → Open on macOS. See docs/packaging.md
# for signing setup before an official distribution.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Bundle for ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      # Three matrix jobs upload to the same draft release; tauri-action races
      # if the draft doesn't exist yet and can end up creating duplicates.
      # Pre-create it ONCE so every job finds an existing draft to append to.
      - name: Ensure draft release exists
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" 2>/dev/null \
            || gh release create "${{ github.ref_name }}" \
                 --repo "$GITHUB_REPOSITORY" \
                 --draft \
                 --prerelease=false \
                 --title "StageCue ${{ github.ref_name }}" \
                 --notes "Installers for all platforms. Windows: NSIS .exe or .msi setup (SmartScreen may warn — More info → Run anyway). Linux: AppImage (chmod +x, then run) or .deb/.rpm. macOS: right-click → Open."
        continue-on-error: true

      - name: Build and attach installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "StageCue ${{ github.ref_name }}"
          releaseBody: >
            Installers for all platforms. Windows: run the NSIS .exe setup
            (SmartScreen may warn — More info → Run anyway). Linux: AppImage
            (chmod +x, then run) or .deb. macOS: right-click → Open.
            Docs: README.md and docs/.
          releaseDraft: true
          prerelease: false
